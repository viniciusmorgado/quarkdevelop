# Flatpak manifest of MonoDevelop for Linux (M7, ADR 0022).
#
# A "binary" manifest: the IDE is built beforehand in the development container
# (`./scripts/pm ./scripts/build.sh -c Release` -> main/build) and copied in as a directory source, so
# flatpak-builder never needs network access or a NuGet restore. The .NET 10 SDK of the
# org.freedesktop.Sdk.Extension.dotnet10 extension is copied into /app/lib/dotnet: it runs the IDE and
# builds user projects (MSBuild and NuGet are loaded from it, ADR 0008 and ADR 0020).
#
# Build: PM_PROFILE=flatpak ./scripts/pm ./scripts/package-flatpak.sh
id: io.github.viniciusmorgado.MonoDevelop
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: monodevelop

finish-args:
  # NuGet feeds, package downloads, `dotnet new`/workload installs
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Projects live anywhere in the home directory; ~/.nuget and ~/.dotnet are shared with a host SDK.
  - --filesystem=home
  - --env=DOTNET_ROOT=/app/lib/dotnet
  - --env=DOTNET_CLI_TELEMETRY_OPTOUT=1
  - --env=DOTNET_NOLOGO=1

build-options:
  # Prebuilt managed assemblies and Microsoft's signed native .NET host: nothing to strip.
  no-debuginfo: true
  strip: false

modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/dotnet /app/bin
      # The whole SDK (install-sdk.sh of the extension leaves out packs/, sdk-manifests/, templates/)
      - cp -a /usr/lib/sdk/dotnet10/lib/. /app/lib/dotnet/
      - ln -s ../lib/dotnet/dotnet /app/bin/dotnet
      # /app is read-only at run time: workloads go to ~/.dotnet (user-local install mode of the SDK).
      - |
        for sdk in /app/lib/dotnet/sdk/*/; do
          version="$(basename "$sdk")"
          band="${version%.*}.$(( ${version##*.} / 100 * 100 ))"
          mkdir -p "/app/lib/dotnet/metadata/workloads/$band"
          touch "/app/lib/dotnet/metadata/workloads/$band/userlocal"
        done

  - name: monodevelop
    buildsystem: simple
    sources:
      - type: dir
        path: ../../main/build
        dest: build
        skip:
          - tests
          - samples
      - type: dir
        path: icons
        dest: icons
      - type: file
        path: ../../main/COPYING
      - type: file
        path: monodevelop.sh
      - type: file
        path: io.github.viniciusmorgado.MonoDevelop.desktop
      - type: file
        path: io.github.viniciusmorgado.MonoDevelop.metainfo.xml
      - type: file
        path: io.github.viniciusmorgado.MonoDevelop.xml
    build-commands:
      - mkdir -p /app/lib/monodevelop
      - cp -a build/bin build/AddIns build/data build/locale /app/lib/monodevelop/
      # Keep the native assets of this architecture only (NuGet packages ship every RID).
      - |
        case "$FLATPAK_ARCH" in
          aarch64) rid=linux-arm64 ;;
          *) rid=linux-x64 ;;
        esac
        find /app/lib/monodevelop -type d -path '*/runtimes/*' -prune | while read -r dir; do
          case "$(basename "$dir")" in
            unix|linux|"$rid") ;;
            *) rm -rf "$dir" ;;
          esac
        done
      - install -Dm755 monodevelop.sh /app/bin/monodevelop
      - ln -s monodevelop /app/bin/mdtool
      - install -Dm644 io.github.viniciusmorgado.MonoDevelop.desktop -t /app/share/applications
      - install -Dm644 io.github.viniciusmorgado.MonoDevelop.metainfo.xml -t /app/share/metainfo
      - install -Dm644 io.github.viniciusmorgado.MonoDevelop.xml -t /app/share/mime/packages
      - install -Dm644 COPYING -t /app/share/licenses/io.github.viniciusmorgado.MonoDevelop
      # The QuarkDevelop logo (Assets/quark_logo.png) scaled to the hicolor PNG sizes.
      - |
        for size in 16 22 24 32 48 64 128 256 512; do
          install -Dm644 "icons/quarkdevelop-$size.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/io.github.viniciusmorgado.MonoDevelop.png"
        done
