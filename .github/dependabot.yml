# Dependency updates (T118). NuGet versions are central (main/Directory.Packages.props, ADR 0004);
# the lock files are refreshed by the update PRs. Vendored forks in main/vendor are updated by hand
# (see their UPSTREAM.md). The Dockerfile base images are pinned by digest through ARGs, which
# Dependabot's docker updater does not follow; they are bumped by hand with the .NET SDK (global.json).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      roslyn:
        patterns: ["Microsoft.CodeAnalysis*"]
      msbuild:
        patterns: ["Microsoft.Build*"]
      nuget-client:
        patterns: ["NuGet.*"]
      test:
        patterns: ["NUnit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Microsoft.TestPlatform*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
