name: ci

# Linux CI (constitution: CI/CD). Every step runs inside the same dev container image that
# developers use locally through ./scripts/pm, built from ./Containerfile.

on:
  push:
    branches: [main, "migration/**", dotnet-linux-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ContinuousIntegrationBuild: "true"
  # Share the runner's NuGet cache (restored by actions/cache) with the dev container.
  # The runner's NuGet cache is mounted outside the container home: a mount inside /home/dev made podman create
  # /home/dev/.nuget as root on a fresh runner, and dotnet could not read its NuGet.Config.
  PM_PODMAN_ARGS: -v /home/runner/.nuget/packages:/nuget-packages -e NUGET_PACKAGES=/nuget-packages -e CI -e ContinuousIntegrationBuild

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'main/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build dev image
        run: |
          mkdir -p ~/.nuget/packages
          ./scripts/pm dotnet --info

      # setup, lint, build --check, duplicate assemblies, tests + coverage ratchet, audit,
      # mdtool smoke and GUI smoke (Xvfb): the same gate developers run locally (T115).
      - name: CI gate (scripts/ci.sh)
        run: ./scripts/pm ./scripts/ci.sh

      - name: Job summary
        if: always()
        run: |
          { echo '### CI gate'; echo '```'; cat out/ci/summary.txt 2>/dev/null || echo 'no summary'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Version
        if: always()
        id: version
        run: echo "version=$(sed -nE 's/^Version=//p' version.config | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monodevelop-ci-${{ steps.version.outputs.version }}+${{ github.sha }}
          path: |
            out/ci/
            out/coverage/
            out/tests/**/*.trx
          if-no-files-found: warn
