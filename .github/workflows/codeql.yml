name: codeql

# Static analysis (T118). C# is analysed without a build (build-mode: none), so the job does not
# need the dev container; the workflows themselves are analysed as "actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # legacy code outside the Linux build (ADR 0017) and test fixtures
          config: |
            paths-ignore:
              - main/external
              - main/tests/test-projects
              - main/src/addins/MacPlatform
              - main/src/addins/WindowsPlatform
              - spikes

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
