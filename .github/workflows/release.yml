name: release

# Releases what reaches main (develop -> main pull requests, ADR 0021). The version comes from the newest v* tag
# and the commit subjects since it: "BREAKING CHANGE:" -> major, "feat" -> minor, anything else -> patch. A merge
# that changes nothing that goes into the Flatpak releases nothing. The build job only reads the repository; the
# publish job is the only one allowed to write: it creates the tag and the GitHub release together, then
# fast-forwards develop to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: "true"
  ContinuousIntegrationBuild: "true"
  # The runner's NuGet cache is mounted outside the container home: a mount inside /home/dev made podman create
  # /home/dev/.nuget as root on a fresh runner, and dotnet could not read its NuGet.Config.
  PM_PODMAN_ARGS: -v /home/runner/.nuget/packages:/nuget-packages -e NUGET_PACKAGES=/nuget-packages -e CI -e ContinuousIntegrationBuild

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release version
        id: version
        run: |
          last_tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [[ -z "$last_tag" ]]; then
            echo "::error::no v* tag to version from (ADR 0021)"
            exit 1
          fi
          # only what goes into the Flatpak makes a release
          if [[ -z "$(git diff --name-only "$last_tag..HEAD" -- main packaging global.json NuGet.config)" ]]; then
            echo "Nothing that goes into the Flatpak changed since $last_tag: nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          released="${last_tag#v}"
          released="${released%%-*}"
          subjects="$(git log --format=%s --no-merges "$last_tag..HEAD")"
          if grep -q '^BREAKING CHANGE:' <<< "$subjects"; then
            bump="major"
          elif grep -q '^feat' <<< "$subjects"; then
            bump="minor"
          else
            bump="patch"
          fi
          IFS=. read -r major minor patch <<< "$released"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "Released: $last_tag, bump: $bump, next: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: NuGet cache
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'main/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build dev image
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p ~/.nuget/packages
          ./scripts/pm dotnet --info

      - name: Release gate (scripts/ci.sh)
        if: steps.version.outputs.skip != 'true'
        run: ./scripts/pm ./scripts/ci.sh

      - name: Gate summary
        if: always() && steps.version.outputs.skip != 'true'
        run: |
          {
            echo '### Release gate'; echo '```'; cat out/ci/summary.txt 2>/dev/null || echo 'no summary'; echo '```'
            if [[ -s out/ci/failures.txt ]]; then
              echo '### Failures'; echo '```'; cat out/ci/failures.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # M7 (T123, ADR 0022): the Flatpak bundle, its sha256 and the CycloneDX SBOM, built in the flatpak
      # profile of scripts/pm from the Release output of the gate above
      - name: Package
        if: steps.version.outputs.skip != 'true'
        env:
          PM_PROFILE: flatpak
          MD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PM_PODMAN_ARGS: ${{ env.PM_PODMAN_ARGS }} -e MD_RELEASE_VERSION
        run: |
          ./scripts/pm ./scripts/package-flatpak.sh
          mkdir -p out/release
          cp out/monodevelop.flatpak out/monodevelop.flatpak.sha256 out/monodevelop.cdx.json out/release/

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out/release
          {
            echo "QuarkDevelop for Linux on .NET 10, version $VERSION (commit ${GITHUB_SHA::12})."
            echo
            # the hand-written notes of this version, when there are any (docs/release-notes/v<version>.md)
            if [[ -f "docs/release-notes/v$VERSION.md" ]]; then
              sed '1d' "docs/release-notes/v$VERSION.md"
              echo
            fi
            # the commits since the previous release
            previous="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            if [[ -n "$previous" ]]; then
              echo "### Changes since $previous"
              git log --format='- %s' --no-merges "$previous..HEAD"
              echo
            fi
            echo '```'
            cat out/ci/summary.txt
            echo '```'
            echo
            sed '1d' docs/BREAKING-CHANGES.md
          } > out/release-notes.md
          cp out/ci/summary.txt out/release/ci-summary.txt

      - name: Upload release files
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monodevelop-${{ steps.version.outputs.version }}+${{ github.sha }}
          path: |
            out/release/
            out/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: monodevelop-${{ needs.build.outputs.version }}+${{ github.sha }}
          path: dist

      # gh creates the tag v<VERSION> on the released commit together with the release
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "QuarkDevelop $VERSION" --notes-file dist/release-notes.md "${flags[@]}" dist/release/*

      # After the merge, main is one merge commit ahead of develop: a fast-forward brings develop up to the
      # release. If develop got new commits meanwhile, this step fails and the release stays as it is.
      - name: Fast-forward develop to main
        run: |
          git fetch origin develop
          if [[ "$(git rev-parse origin/develop)" == "$(git rev-parse HEAD)" ]]; then
            echo "develop already matches main."
          elif git merge-base --is-ancestor origin/develop HEAD; then
            git push origin HEAD:develop
          else
            echo "::error::develop has commits that main does not; bring develop up to main by hand"
            git log --oneline HEAD..origin/develop
            exit 1
          fi
