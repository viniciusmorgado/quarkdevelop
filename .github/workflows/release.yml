name: release

# Releases from a SemVer tag v<major>.<minor>.<patch>[-<pre-release>] (ADR 0021). The build job only
# reads the repository; the publish job is the only one allowed to write (it creates the release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  ContinuousIntegrationBuild: "true"
  # The runner's NuGet cache is mounted outside the container home: a mount inside /home/dev made podman create
  # /home/dev/.nuget as root on a fresh runner, and dotnet could not read its NuGet.Config.
  PM_PODMAN_ARGS: -v /home/runner/.nuget/packages:/nuget-packages -e NUGET_PACKAGES=/nuget-packages -e CI -e ContinuousIntegrationBuild

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::tag $TAG is not v<SemVer> (ADR 0021)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'main/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build dev image
        run: |
          mkdir -p ~/.nuget/packages
          ./scripts/pm dotnet --info

      - name: Release gate (scripts/ci.sh)
        run: ./scripts/pm ./scripts/ci.sh

      - name: Gate summary
        if: always()
        run: |
          {
            echo '### Release gate'; echo '```'; cat out/ci/summary.txt 2>/dev/null || echo 'no summary'; echo '```'
            if [[ -s out/ci/failures.txt ]]; then
              echo '### Failures'; echo '```'; cat out/ci/failures.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # M7 (T123, ADR 0022): the Flatpak bundle, its sha256 and the CycloneDX SBOM, built in the flatpak
      # profile of scripts/pm from the Release output of the gate above
      - name: Package
        if: hashFiles('scripts/package-flatpak.sh') != ''
        env:
          PM_PROFILE: flatpak
          MD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PM_PODMAN_ARGS: ${{ env.PM_PODMAN_ARGS }} -e MD_RELEASE_VERSION
        run: |
          ./scripts/pm ./scripts/package-flatpak.sh
          mkdir -p out/release
          cp out/monodevelop.flatpak out/monodevelop.flatpak.sha256 out/monodevelop.cdx.json out/release/

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out/release
          {
            echo "MonoDevelop for Linux on .NET 10, version $VERSION (commit ${GITHUB_SHA::12})."
            echo
            # the hand-written notes of this version, when there are any (docs/release-notes/v<version>.md)
            if [[ -f "docs/release-notes/v$VERSION.md" ]]; then
              sed '1d' "docs/release-notes/v$VERSION.md"
              echo
            fi
            echo '```'
            cat out/ci/summary.txt
            echo '```'
            echo
            sed '1d' docs/BREAKING-CHANGES.md
          } > out/release-notes.md
          cp out/ci/summary.txt out/release/ci-summary.txt

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: monodevelop-${{ steps.version.outputs.version }}+${{ github.sha }}
          path: |
            out/release/
            out/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: monodevelop-${{ needs.build.outputs.version }}+${{ github.sha }}
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MonoDevelop $VERSION" --notes-file dist/release-notes.md "${flags[@]}" dist/release/*
